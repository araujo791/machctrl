name: Reverter Commits do Lovable-dev[bot]

on:
  workflow_dispatch:
    inputs:
      commit_shas:
        description: 'SHAs dos commits separados por espaço'
        required: true
        default: '829e1a99b32cfd90ebab2543237388b7ab21f203 ae331643146d8a1188eda9f01c8ca6a41f876d63 d7732442ca3faa26fd50da69f480e91de611068f a8026a3d50645d455b08ff726f74d85b430c92b9 ebe27bcb7c6a4c46c7a73e59ecfb4137fd43c044 4de62d36aee0be3b0b819a515d9f2ba381fb86bc'
      branch:
        description: 'Branch para reverter'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  revert-commits:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create revert branch
        run: |
          TIMESTAMP=$(date +%s)
          git checkout -b revert/lovable-$TIMESTAMP
          echo "REVERT_BRANCH=revert/lovable-$TIMESTAMP" >> $GITHUB_ENV

      - name: Revert commits
        run: |
          COMMITS="${{ github.event.inputs.commit_shas }}"
          echo "📋 Commits a reverter:"
          echo "$COMMITS"
          echo ""
          
          REVERT_SUCCESS=0
          REVERT_FAILED=0
          
          for commit in $COMMITS; do
            echo "🔄 Processando: $commit"
            
            # Verifica se é um merge commit
            PARENT_COUNT=$(git rev-list --parents -n 1 $commit | wc -w)
            PARENT_COUNT=$((PARENT_COUNT - 1))
            
            if [ $PARENT_COUNT -gt 1 ]; then
              echo "   ℹ️ É um merge commit (parents: $PARENT_COUNT)"
              # Para merge commits, usa -m 1 para manter o primeiro parent
              if git revert -m 1 --no-edit "$commit" 2>&1; then
                ((REVERT_SUCCESS++))
                echo "   ✅ Revertido com sucesso (merge)"
              else
                ((REVERT_FAILED++))
                echo "   ⚠️ Falha ao reverter merge"
              fi
            else
              echo "   ℹ️ É um commit normal"
              # Para commits normais, revert simples
              if git revert --no-edit "$commit" 2>&1; then
                ((REVERT_SUCCESS++))
                echo "   ✅ Revertido com sucesso"
              else
                ((REVERT_FAILED++))
                echo "   ⚠️ Falha ao reverter"
              fi
            fi
          done
          
          echo ""
          echo "📊 Resumo:"
          echo "  - Sucesso: $REVERT_SUCCESS"
          echo "  - Falha: $REVERT_FAILED"
          echo ""
          echo "REVERT_SUCCESS=$REVERT_SUCCESS" >> $GITHUB_ENV
          echo "REVERT_FAILED=$REVERT_FAILED" >> $GITHUB_ENV

      - name: Check for changes
        id: changes
        run: |
          DIFF_COUNT=$(git diff origin/${{ github.event.inputs.branch }} | wc -l)
          echo "diff_count=$DIFF_COUNT" >> $GITHUB_OUTPUT
          
          echo "📊 Análise de mudanças:"
          echo "  - Linhas de diferença: $DIFF_COUNT"
          
          if [ "$DIFF_COUNT" -gt 0 ]; then
            echo "  - Status: ✅ Mudanças detectadas"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          else
            echo "  - Status: ⚠️ Nenhuma mudança detectada"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Display changes
        if: env.HAS_CHANGES == 'true'
        run: |
          echo "📝 Diferenças detectadas:"
          git diff --stat origin/${{ github.event.inputs.branch }}

      - name: Push branch
        if: env.HAS_CHANGES == 'true'
        run: |
          echo "📤 Enviando branch..."
          git push origin ${{ env.REVERT_BRANCH }}
          echo "✅ Branch enviada com sucesso"

      - name: Create Pull Request
        if: env.HAS_CHANGES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.REVERT_BRANCH;
            const commits = process.env.COMMITS.split(' ');
            const successCount = process.env.REVERT_SUCCESS;
            const failedCount = process.env.REVERT_FAILED;
            
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Reverter commits do lovable-dev[bot]',
                head: branch,
                base: '${{ github.event.inputs.branch }}',
                body: `## 🔄 Revert de Commits\n\n### 📊 Resumo da Operação\n- ✅ Commits revertidos com sucesso: ${successCount}\n- ⚠️ Commits que falharam: ${failedCount}\n\n### 📋 Commits Processados:\n${commits.map(c => `- \`${c}\``).join('\n')}\n\n---\n\n⚠️ **Por favor revise os detalhes:**\n- ✅ Revise todas as alterações\n- ✅ Verifique se não há conflitos\n- 📝 Teste antes de fazer merge\n\n---\n\n**Próximo passo:** Revise e faça merge quando pronto.`
              });
              
              console.log(`✅ PR criado com sucesso!`);
              console.log(`📎 Link: ${pr.html_url}`);
            } catch (error) {
              console.error(`❌ Erro ao criar PR: ${error.message}`);
              throw error;
            }
        env:
          REVERT_BRANCH: ${{ env.REVERT_BRANCH }}
          COMMITS: ${{ github.event.inputs.commit_shas }}
          REVERT_SUCCESS: ${{ env.REVERT_SUCCESS }}
          REVERT_FAILED: ${{ env.REVERT_FAILED }}

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  📋 RESUMO DA EXECUÇÃO"
          echo "=========================================="
          echo "Branch: ${{ env.REVERT_BRANCH }}"
          echo "Mudanças detectadas: ${{ env.HAS_CHANGES }}"
          if [ "${{ env.HAS_CHANGES }}" == "true" ]; then
            echo "Status: ✅ PR será criado"
          else
            echo "Status: ℹ️ Nenhuma mudança, PR não será criado"
          fi
          echo "=========================================="
